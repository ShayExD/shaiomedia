<!doctype html><html lang="he"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:Rubik;src:url("FONT_400") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:Rubik;src:url("FONT_700") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Rubik;src:url("FONT_800") format("woff2");font-weight:800;font-display:block}
html,body{width:1200px;height:630px;overflow:hidden;background:#050A13}
.stage{position:relative;width:1200px;height:630px;overflow:hidden;
  font-family:Rubik,sans-serif;direction:rtl;background:#050A13}

/* A quiet field rather than a screenshot: these two pages sell management, and
   there is no artefact to show the way the homepage can show a built site. */
.glow{position:absolute;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(27,79,138,.55) 0%,rgba(27,79,138,.16) 45%,transparent 70%);
  top:-330px;inset-inline-start:-220px}
.glow2{position:absolute;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,143,224,.26) 0%,transparent 68%);
  bottom:-360px;inset-inline-end:-200px}
.grid{position:absolute;inset:0;opacity:.4;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 78% 74% at 50% 46%,#000 25%,transparent 78%)}

.copy{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;padding:0 86px;text-align:right}
.logo{height:38px;width:auto;margin-bottom:34px}
.kicker{font-size:19px;font-weight:600;color:#4C8FE0;letter-spacing:.01em;margin-bottom:16px}
h1{font-size:60px;font-weight:800;line-height:1.1;letter-spacing:-.026em;color:#fff}
h1 span{color:#4C8FE0}
p.sub{margin-top:20px;font-size:23px;line-height:1.45;color:#8AA6C6;max-width:830px}

.chips{margin-top:40px;display:flex;gap:11px}
.chip{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.06);
  border-radius:999px;padding:11px 22px;display:flex;align-items:baseline;gap:8px}
.chip b{font-size:23px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.chip i{font-size:16px;font-style:normal;color:#8AA6C6}

.rule{position:absolute;inset-block:0;inset-inline-start:0;width:9px;
  background:linear-gradient(180deg,#1B4F8A,#4C8FE0)}
</style></head><body>
<div class="stage">
  <div class="glow"></div><div class="glow2"></div><div class="grid"></div>
  <div class="rule"></div>
  <div class="copy">
    <img class="logo" src="LOGO_SRC" alt="">
    <div class="kicker">KICKER</div>
    <h1>HEADLINE</h1>
    <p class="sub">SUB</p>
    <div class="chips">CHIPS</div>
  </div>
</div>
</body></html>
