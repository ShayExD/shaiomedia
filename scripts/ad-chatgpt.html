<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:Rubik;src:url("{{FONT}}") format("woff2");font-weight:300 900;font-display:block}
html,body{width:1080px;height:1080px;overflow:hidden;background:#050A13}
.stage{position:relative;width:1080px;height:1080px;overflow:hidden;
  font-family:Rubik,sans-serif;direction:rtl;background:#050A13}

.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;
  background:radial-gradient(circle,rgba(27,79,138,.62) 0%,rgba(27,79,138,.18) 44%,transparent 70%);
  top:-420px;inset-inline-start:-260px}
.glow2{position:absolute;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,143,224,.22) 0%,transparent 66%);
  bottom:-380px;inset-inline-end:-220px}
.grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:90px 90px;
  -webkit-mask-image:radial-gradient(ellipse 80% 72% at 50% 44%,#000 22%,transparent 76%)}
.rule{position:absolute;inset-block:0;inset-inline-start:0;width:14px;
  background:linear-gradient(180deg,#1B4F8A,#4C8FE0)}

.wrap{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:84px 92px 76px;text-align:right}

.top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.top img{height:58px;width:auto}
.tag{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.07);border-radius:999px;padding:12px 22px;
  font-size:24px;font-weight:700;color:#CDE0F8;white-space:nowrap}
.tag svg{width:28px;height:28px;flex:none}

.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:34px}
h1{font-size:{{INSIZE}};font-weight:800;line-height:1.08;letter-spacing:-.03em;color:#fff}
h1 span{color:#4C8FE0}
p.sub{margin-top:30px;font-size:34px;line-height:1.4;color:#8AA6C6;max-width:820px}

.chips{margin-top:44px;display:flex;flex-wrap:wrap;gap:14px}
.chip{display:inline-flex;align-items:center;gap:11px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);border-radius:999px;padding:14px 24px;
  font-size:26px;font-weight:600;color:#D8E2EE}
.chip i{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;
  background:rgba(76,143,224,.24);flex:none}
.chip i svg{width:17px;height:17px}

.bot{display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta{display:inline-flex;align-items:center;gap:14px;background:#2E6FB8;color:#fff;
  border-radius:999px;padding:24px 46px;font-size:32px;font-weight:800;white-space:nowrap;
  box-shadow:0 18px 34px -14px rgba(0,0,0,.65)}
.cta svg{width:26px;height:26px}
.marks{display:flex;align-items:center;gap:22px;opacity:.72}
.marks svg{width:40px;height:40px}
</style></head><body>
<div class="stage">
  <div class="glow"></div><div class="glow2"></div><div class="grid"></div><div class="rule"></div>
  <div class="wrap">

    <div class="top">
      <img src="{{LOGO}}" alt="">
      <span class="tag">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.998-2.9 6.056 6.056 0 0 0-.748-7.073Zm-9.022 12.608a4.476 4.476 0 0 1-2.876-1.04l.142-.08 4.778-2.758a.795.795 0 0 0 .393-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.495 4.493Zm-9.66-4.125a4.471 4.471 0 0 1-.535-3.014l.142.085 4.783 2.758a.771.771 0 0 0 .78 0l5.843-3.369v2.333a.08.08 0 0 1-.033.061L9.74 19.95a4.499 4.499 0 0 1-6.14-1.646ZM2.341 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.677l5.814 3.354-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786a4.504 4.504 0 0 1-1.647-6.117Zm16.597 3.856-5.833-3.388L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.104v-5.677a.79.79 0 0 0-.407-.667Zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.499 4.499 0 0 1 6.681 4.66ZM8.306 12.863l-2.02-1.164a.08.08 0 0 1-.038-.057V6.074a4.499 4.499 0 0 1 7.376-3.454l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681Zm1.098-2.366 2.602-1.5 2.607 1.5v3l-2.597 1.5-2.607-1.5Z"/></svg>
        ChatGPT Ads
      </span>
    </div>

    <div class="mid">
      <h1>{{HEADLINE}}</h1>
      <p class="sub">{{SUB}}</p>
      <div class="chips">{{CHIPS}}</div>
    </div>

    <div class="bot">
      <span class="cta">
        {{CTA}}
        <svg viewBox="0 0 24 24" fill="none"><path d="M14 6l-6 6 6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="marks">{{MARKS}}</span>
    </div>

  </div>
</div>
</body></html>
